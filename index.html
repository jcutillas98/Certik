return `<div class="backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-label="Crear campaña"><div class="modal-head"><div><div class="eyebrow">CERTIK INTELLIGENT CAMPAIGNS</div><h2>Crear nueva campaña</h2></div><button class="btn square outline" data-action="close-modal">${icon('x')}</button></div><div class="modal-body"><div class="flowsteps" style="margin-bottom:20px">${[1,2,3].map(i=>`<span class="flowstep ${i<w.step?'done':i===w.step?'active':''}">${i<w.step?icon('check','sm'):i} ${['','Alcance','Granularidad','Revisores'][i]}</span>`).join('')}</div>${body}</div><div class="modal-foot"><button class="btn outline" data-action="wizard-prev">${w.step===1?'Cancelar':'Anterior'}</button><button class="btn primary" data-action="${w.step===3?'wizard-launch':'wizard-next'}">${w.step===3?'Lanzar campaña':'Continuar'} ${icon('arrow','sm')}</button></div></div></div>`}
function candidateIds(w){let gs=activeGrants().filter(g=>g.project===w.project);if(w.template==='unused')gs=gs.filter(g=>g.days>60||!g.mfa);else if(w.template==='risky')gs=gs.filter(g=>g.risk>=45||g.anomaly);return gs.map(g=>g.id)}
function modalUI(){if(session.wizard)return wizardModal();if(!session.modal)return '';const m=session.modal;if(m.type==='decision'){const g=getGrant(m.grantId),c=getCampaign(m.campaignId);if(!g||!c)return '';const required=m.decision!=='mantener'||g.risk>=75;const help=m.decision==='mantener'&&g.risk>=75?'Mantener un acceso de riesgo alto exige una justificación.':m.decision==='revocar'?'Explica por qué no debe conservar el acceso. Se registrará una solicitud, sin revocar nada en cloud.':m.decision==='investigar'?'Indica qué información necesitas antes de certificar.':'Comentario opcional para aportar evidencias.';return `<div class="backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-label="Confirmar decisión"><div class="modal-head"><div><div class="eyebrow">ACCESS ATTESTATION</div><h2>${accessLabel(m.decision)} · ${esc(g.name)}</h2></div><button class="btn square outline" data-action="close-modal">${icon('x')}</button></div><div class="modal-body"><div class="space"><div><b>Rol: ${esc(g.role)}</b><p class="small">${esc(g.resource)} · ${g.cloud}</p></div>${riskPill(g.risk)}</div><div class="recommend" style="margin:16px 0"><div class="flex">${icon('spark')} <b>Recomendación CERTIK AI</b></div><p style="margin-top:8px">${esc(recommendText(g))}</p></div><label class="fieldlabel" for="comment-field">Justificación ${required?'(obligatoria)':'(opcional)'}</label><textarea class="input" rows="4" id="comment-field" placeholder="Añade el motivo de negocio o la evidencia de tu decisión..."></textarea><div class="small muted" style="margin-top:6px">${help}</div><div class="login-error" id="comment-error"></div></div><div class="modal-foot"><button class="btn outline" data-action="close-modal">Cancelar</button><button class="btn ${m.decision==='revocar'?'red':'primary'}" data-action="confirm-decision">${icon('check','sm')} Confirmar ${accessLabel(m.decision).toLowerCase()}</button></div></div></div>`}
if(m.type==='execute'){const c=getCampaign(m.id),revoke=c.grantIds.filter(id=>c.decisions[id]?.decision==='revocar'&&!getGrant(id).executed);return `<div class="backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-label="Confirmar simulación"><div class="modal-head"><h2>Simular ejecución de revocaciones</h2><button class="btn square outline" data-action="close-modal">${icon('x')}</button></div><div class="modal-body"><div class="recommend"><div class="flex">${icon('info')}<b>Esto es solo una simulación</b></div><p style="margin-top:10px">No habrá cambios reales en AWS, Azure o GCP. Los ${revoke.length} accesos seleccionados desaparecerán del inventario activo de esta demo y el scoring se actualizará.</p></div><div class="stack" style="margin-top:14px">${revoke.map(id=>{const g=getGrant(id);return `<div class="space small"><span>${esc(g.name)} · ${esc(g.role)}</span>${cloudTag(g.cloud)}</div>`}).join('')}</div></div><div class="modal-foot"><button class="btn outline" data-action="close-modal">Cancelar</button><button class="btn primary" data-action="execute-confirm" data-id="${c.id}">${icon('zap','sm')} Ejecutar simulación</button></div></div></div>`}
if(m.type==='reset')return `<div class="backdrop" data-action="close-modal"><div class="modal" role="dialog" aria-label="Reiniciar demo"><div class="modal-head"><h2>¿Reiniciar todos los datos de la demo?</h2><button class="btn square outline" data-action="close-modal">${icon('x')}</button></div><div class="modal-body"><p>Se restaurarán las campañas originales, los accesos, el scoring y las decisiones iniciales. No afectará a ningún servicio externo.</p></div><div class="modal-foot"><button class="btn outline" data-action="close-modal">Cancelar</button><button class="btn red" data-action="reset-confirm">Reiniciar piloto</button></div></div></div>`;
return ''}
function render(){const app=document.getElementById('app');if(!session.role){app.innerHTML=loginPage();return}const view=session.role==='admin'?({dashboard:dashboard,inventory:inventory,campaigns:()=>session.campaignId?campaignDetailsAdmin(getCampaign(session.campaignId)):campaignList()})[session.view]:( {myCampaigns:()=>session.campaignId?reviewDetails(getCampaign(session.campaignId)):reviewerHome(),myActivity:myActivity})[session.view];app.innerHTML=`<div class="shell">${sideBar()}<div class="workspace">${topBar()}<main class="content reveal">${view?view():''}</main></div></div>${drawerUI()}${modalUI()}`}
function startWizard(template='unused',project='web360'){session.drawer=null;session.campaignId=null;session.modal=null;session.wizard={step:1,template,project,granularity:'smart',mode:'business',flow:'sequential',name:''};render()}
function act(action,button){const id=button.dataset.id;const field=button.dataset.field;switch(action){
case 'login-type':session.loginType=id;render();break;
case 'fill-demo':{const u=document.getElementById('username'),p=document.getElementById('password');if(!u||!p)return;u.value=session.loginType==='admin'?'admin@inkube.solutions':'reviewer@inkube.solutions';p.value=session.loginType==='admin'?'CertikAdmin2026!':'CertikReview2026!';toast('Credenciales de demo cargadas');break}
case 'logout':session={role:null,user:null,view:'dashboard',provider:'All',inventorySearch:'',projectId:null,drawer:null,projectTab:'overview',identityId:null,modal:null,campaignId:null,reviewFilter:'all',reviewExpand:null,wizard:null,loginType:'admin'};render();break;
case 'nav':session.campaignId=null;navigate(id);break;
case 'provider-nav':session.provider=id;navigate('inventory');break;
case 'provider':session.provider=id;render();break;
case 'inventory-reset':session.provider='All';session.inventorySearch='';render();break;
case 'project':openProject(id);break;
case 'finding':openProject(id,'risks');break;
case 'grant':openGrant(id);break;
case 'project-tab':session.projectTab=id;render();break;
case 'close-drawer':session.drawer=null;render();break;
case 'campaign':openCampaign(id);if(session.role==='reviewer'){session.reviewExpand=getCampaign(id)?.grantIds[0]||null;render()}break;
case 'campaign-back':session.campaignId=null;render();break;
case 'review-filter':session.reviewFilter=id;render();break;
case 'review-expand':session.reviewExpand=session.reviewExpand===id?null:id;render();break;
case 'review-decision':{const c=getCampaign(session.campaignId),g=getGrant(id);if(!c||!g||!allowedCampaign(c))return toast('Esta campaña no está asignada a tu perfil');if(c.mode==='both'&&c.flow==='sequential'&&reviewIdentity()==='business'&&!c.reviewerDecisions?.technical?.[id])return toast('Debe completarse primero la revisión técnica');session.modal={type:'decision',campaignId:c.id,grantId:id,decision:button.dataset.decision};render();break}
case 'confirm-decision':{const m=session.modal,c=getCampaign(m?.campaignId),g=getGrant(m?.grantId);if(!m||!c||!g)return;const text=document.getElementById('comment-field')?.value?.trim()||'';if((m.decision!=='mantener'||g.risk>=75)&&text.length<5){document.getElementById('comment-error').textContent='Añade una justificación de al menos 5 caracteres.';return}const decision={decision:m.decision,comment:text,by:currentReviewer(),reviewType:reviewIdentity(),date:'21 oct 2026'};if(c.mode==='both'){c.reviewerDecisions??={technical:{},business:{}};c.reviewerDecisions[reviewIdentity()][g.id]=decision;const t=c.reviewerDecisions.technical[g.id],b=c.reviewerDecisions.business[g.id];if(t&&b){const conflict=t.decision!==b.decision;c.decisions[g.id]={...b,decision:conflict?'investigar':b.decision,conflict,technical:t,business:b}}}else c.decisions[g.id]=decision;data.audit.unshift({time:'Ahora',text:`${currentReviewer()} ha decidido ${accessLabel(m.decision).toLowerCase()} · ${g.name}`,type:'review'});save();session.modal=null;render();toast(`Decisión registrada: ${accessLabel(m.decision)} · ${g.name}`);break}
case 'new-wizard':startWizard();break;
case 'suggest':startWizard(id,'web360');break;
case 'suggest-project':session.drawer=null;session.view='campaigns';startWizard('risky',id);break;
case 'wizard-set':if(session.wizard){session.wizard[field]=id;render()}break;
case 'wizard-next':if(session.wizard?.step===1){const sel=document.getElementById('wizard-project');if(sel)session.wizard.project=sel.value}if(session.wizard)session.wizard.step=Math.min(3,session.wizard.step+1);render();break;
case 'wizard-prev':if(session.wizard?.step===1)session.wizard=null;else if(session.wizard)session.wizard.step=Math.max(1,session.wizard.step-1);render();break;
case 'wizard-launch':{const w=session.wizard;if(!w)return;const temp=templates.find(x=>x.id===w.template),pr=getProject(w.project),ids=candidateIds(w),name=document.getElementById('wizard-name')?.value.trim()||`${temp.title} · ${pr.name}`;if(ids.length===0)return toast('El alcance seleccionado no contiene accesos');const c={id:'camp-'+data.nextId++,name,project:w.project,template:temp.title,granularity:{smart:'Agrupación inteligente por rol',role:'Roles y grupos',permission:'Permisos y asignaciones detallados'}[w.granularity],mode:w.mode,flow:w.flow,created:'21 oct 2026',due:'06 nov 2026',createdBy:'Administrador CERTIK',grantIds:ids,decisions:{},reviewerDecisions:{technical:{},business:{}},stage:'active',execution:[]};data.campaigns.unshift(c);data.audit.unshift({time:'Ahora',text:`Nueva campaña creada: ${name}`,type:'campaign'});save();session.wizard=null;session.modal=null;session.campaignId=c.id;session.view='campaigns';render();toast(`Campaña lanzada: ${ids.length} accesos para revisión`);break}
case 'exec-prompt':session.modal={type:'execute',id};render();break;
case 'execute-confirm':{const c=getCampaign(id);if(!c)return;const ids=c.grantIds.filter(i=>c.decisions[i]?.decision==='revocar'&&!c.decisions[i]?.conflict&&!getGrant(i).executed);ids.forEach(i=>getGrant(i).executed=true);c.execution.push({date:'21 oct 2026',ids});data.audit.unshift({time:'Ahora',text:`Ejecución simulada: ${ids.length} revocaciones · ${getProject(c.project).name}`,type:'execution'});save();session.modal=null;render();toast(`${ids.length} accesos revocados en simulación. Riesgo recalculado.`);break}
case 'close-modal':session.modal=null;session.wizard=null;render();break;
case 'reset-prompt':session.modal={type:'reset'};render();break;
case 'reset-confirm':data=defaultState();save();session.modal=null;session.drawer=null;session.campaignId=null;session.view='dashboard';render();toast('Datos de la demo restaurados');break;
}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;if((el.classList.contains('backdrop')||el.classList.contains('drawer-backdrop'))&&e.target!==el)return;act(el.dataset.action,el)});
document.addEventListener('submit',e=>{if(e.target.id!=='loginform')return;e.preventDefault();const email=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const logins={admin:{email:'admin@inkube.solutions',password:'CertikAdmin2026!',name:'Security Admin'},reviewer:{email:'reviewer@inkube.solutions',password:'CertikReview2026!',name:'María López'},tech:{email:'tech@inkube.solutions',password:'CertikTech2026!',name:'Raúl García'}};const profile=Object.entries(logins).find(([k,v])=>v.email===email&&v.password===password&&(session.loginType==='admin'?k==='admin':k!=='admin'));if(!profile){document.getElementById('login-error').textContent='Credenciales incorrectas o perfil no válido para esta entrada.';return}session.role=profile[0]==='admin'?'admin':'reviewer';session.user=profile[1];session.view=session.role==='admin'?'dashboard':'myCampaigns';session.campaignId=null;render();toast(`Bienvenido/a a CERTIK, ${session.user.name}`)});
document.addEventListener('input',e=>{if(e.target.id==='inv-search'){const el=e.target;const val=el.value,pos=el.selectionStart;session.inventorySearch=val;render();const next=document.getElementById('inv-search');next?.focus();next?.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(session.modal||session.wizard){session.modal=null;session.wizard=null;render()}else if(session.drawer){session.drawer=null;render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.kpi')&&!e.target.closest('button')){e.preventDefault();act('nav',e.target)}});
// Empezar siempre en login para mostrar los dos recorridos, sin almacenar credenciales.
render();
</script>
